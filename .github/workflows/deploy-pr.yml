name: Deploy PR to naboo

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ha-inlite-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Gate
        id: gate
        run: |
          if [ "${{ github.event.pull_request.user.login }}" != "bbruenings" ]; then
            echo "author is not bbruenings - skipping"; echo "proceed=false" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "bbruenings/ha-inlite" ]; then
            echo "head repo mismatch (fork) - skipping"; echo "proceed=false" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            echo "draft PR - skipping"; echo "proceed=false" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "proceed=true" >> $GITHUB_OUTPUT

  deploy:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: [self-hosted, ha-deploy]
    environment: ha-deploy
    steps:
      - name: Wait for Tests + Validate on head SHA
        id: wait_checks
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "waiting for checks on $SHA"
          for i in $(seq 1 60); do
            RUNS=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/bbruenings/ha-inlite/actions/runs?head_sha=$SHA&per_page=100")
            PENDING=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.name == "Tests" or .name == "Validate")] | map(select(.status != "completed")) | length')
            FAILED=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.name == "Tests" or .name == "Validate")] | map(select(.conclusion == "failure" or .conclusion == "cancelled")) | length')
            SUCCESS=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.name == "Tests" or .name == "Validate")] | map(select(.conclusion == "success")) | length')
            echo "try $i: pending=$PENDING failed=$FAILED success=$SUCCESS"
            if [ "$FAILED" -gt 0 ]; then echo "checks failed - aborting deploy"; exit 1; fi
            if [ "$SUCCESS" -ge 2 ] && [ "$PENDING" -eq 0 ]; then echo "all checks green"; break; fi
            sleep 15
          done
      - name: Deploy to naboo
        run: bash /opt/ha-deploy/deploy.sh "${{ github.event.pull_request.head.ref }}"
      - name: Summary
        run: |
          echo "## Deployed to naboo" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Head: ${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Log:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 /opt/ha-deploy/last-deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY